<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Canvas MCP: acesso, lembretes e agente</title>
  <desc id="desc">Três funcionalidades independentes: MCP local para Canvas, lembretes no Telegram pelo GitHub e agente Codex ou Claude para atividades.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
  <circle cx="1120" cy="30" r="160" fill="#60a5fa" opacity=".05"/>
  <circle cx="40" cy="340" r="180" fill="#a78bfa" opacity=".05"/>
  <rect x="40" y="36" width="5" height="48" rx="2" fill="url(#accent)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="60" y="62" fill="#f8fafc" font-size="30" font-weight="700">Canvas MCP</text>
    <text x="60" y="90" fill="#cbd5e1" font-size="16">Seu Canvas. Seus prazos. Seu agente.</text>
    <text x="1150" y="62" text-anchor="end" fill="#94a3b8" font-size="13">LOCAL · SEM DEPLOY DO MCP</text>
    <rect x="40" y="125" width="355" height="172" rx="16" fill="#17233b" stroke="#334155"/>
    <rect x="422" y="125" width="355" height="172" rx="16" fill="#17233b" stroke="#334155"/>
    <rect x="804" y="125" width="355" height="172" rx="16" fill="#17233b" stroke="#334155"/>
    <circle cx="78" cy="163" r="18" fill="#0c4a6e"/><text x="78" y="169" text-anchor="middle" fill="#7dd3fc" font-size="17" font-weight="700">1</text>
    <text x="108" y="170" fill="#f8fafc" font-size="20" font-weight="600">MCP do Canvas</text>
    <text x="62" y="211" fill="#cbd5e1" font-size="16">Consultar, editar e enviar</text>
    <text x="62" y="235" fill="#94a3b8" font-size="14">18 ferramentas · catálogo oficial REST</text>
    <text x="62" y="275" fill="#7dd3fc" font-size="13">SEU CLIENTE → API DO CANVAS</text>
    <circle cx="460" cy="163" r="18" fill="#064e3b"/><text x="460" y="169" text-anchor="middle" fill="#6ee7b7" font-size="17" font-weight="700">2</text>
    <text x="490" y="170" fill="#f8fafc" font-size="20" font-weight="600">Lembretes diários</text>
    <text x="444" y="211" fill="#cbd5e1" font-size="16">Prazos às 08h no Telegram</text>
    <text x="444" y="235" fill="#94a3b8" font-size="14">GitHub Actions · sem chamadas de IA</text>
    <text x="444" y="275" fill="#6ee7b7" font-size="13">FUNCIONA COM O MAC DESLIGADO</text>
    <circle cx="842" cy="163" r="18" fill="#4c1d95"/><text x="842" y="169" text-anchor="middle" fill="#c4b5fd" font-size="17" font-weight="700">3</text>
    <text x="872" y="170" fill="#f8fafc" font-size="20" font-weight="600">Agente para atividades</text>
    <text x="826" y="211" fill="#cbd5e1" font-size="16">Codex ou Claude Code</text>
    <text x="826" y="235" fill="#94a3b8" font-size="14">Pedidos pelo bot · automático opcional</text>
    <text x="826" y="275" fill="#c4b5fd" font-size="13">ASSINATURA · EXECUÇÃO LOCAL</text>
    <text x="600" y="328" text-anchor="middle" fill="#64748b" font-size="12">Escolha uma funcionalidade ou combine as três.</text>
  </g>
</svg>
