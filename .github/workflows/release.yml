name: Release and GitHub Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  container:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.19
      - run: uv sync --locked
      - name: Validate version and build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(python scripts/verify_distribution.py --tag "$GITHUB_REF_NAME" --version-only)
          docker build --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_REF_NAME-$ARCH" .
          test "$(docker run --rm "$IMAGE:$GITHUB_REF_NAME-$ARCH" --version)" = "$version"
          uv run python scripts/verify_container.py "$IMAGE:$GITHUB_REF_NAME-$ARCH"
      - name: Publish tested architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=$(python scripts/verify_distribution.py --tag "$GITHUB_REF_NAME" --version-only)
          docker buildx create --name canvas-release --driver docker-container --use
          docker buildx build --platform "linux/$ARCH" --provenance=false \
            --output type=registry,oci-mediatypes=true \
            --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_REF_NAME-$ARCH" .

  publish:
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.19
      - run: uv sync --locked
      - name: Build and verify Python distributions
        run: |
          set -euo pipefail
          uv run pytest -q
          uv build
          python scripts/verify_distribution.py --tag "$GITHUB_REF_NAME"
      - name: Publish multi-architecture manifest
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --annotation 'index:org.opencontainers.image.description=Canvas LMS MCP: REST reads/writes, GraphQL and file transfers. See the repository for Telegram and Codex/Claude setup.' \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation 'index:org.opencontainers.image.licenses=MIT' \
            --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:latest" \
            "$IMAGE:$GITHUB_REF_NAME-amd64" "$IMAGE:$GITHUB_REF_NAME-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_REF_NAME" > /tmp/canvas-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/canvas-index.json').read_text())
          assert manifest['mediaType'] == 'application/vnd.oci.image.index.v1+json'
          assert manifest['annotations']['org.opencontainers.image.licenses'] == 'MIT'
          assert manifest['annotations']['org.opencontainers.image.description']
          PY
      - name: Publish release assets
        run: |
          set -euo pipefail
          version=$(python scripts/verify_distribution.py --tag "$GITHUB_REF_NAME" --version-only)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Canvas MCP $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$version.md" --latest \
            "dist/mcp_instructure_canvas-$version-py3-none-any.whl" \
            "dist/mcp_instructure_canvas-$version.tar.gz" dist/SHA256SUMS
